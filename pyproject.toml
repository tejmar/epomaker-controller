[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epomaker-controller"
version = "0.0.8"
description = "A CLI and GUI controller for Epomaker keyboards (RT100, DynaTab 75X, etc.)"
readme = "README.md"
authors = [
    { name = "strodgers" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0.0",
    "hidapi>=0.14.0",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "gpustat>=1.1.0",
    # Directly imported but previously satisfied only transitively:
    "numpy>=1.21.0",                       # used by the command/report layer
    "opencv-python-headless>=4.5.0",       # cv2, used by image/screen commands
    "nvidia-ml-py>=11.0.0",                # provides the `pynvml` module used by utils/sensors.py
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.entry-points]
console_scripts = { epomakercontroller = "epomakercontroller.__main__:cli" }

[tool.setuptools.packages.find]
where = ["."]
include = ["epomakercontroller*"]

[tool.setuptools.package-data]
epomakercontroller = ["configs/**/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
